# Staging nostream relay (relay.stg.formstr.app), fronted by mesh-PG.
#
# This makes the relay a declared, restart-surviving service instead of a
# hand-started `docker run`. Before this file existed, `nso_nostream` was not
# in any compose project, so a host reboot left the relay down.
#
# Deploy from a checkout of this repo:
#   cp .env.example .env && $EDITOR .env          # set secrets
#   docker compose -f docker-compose.yml up -d
#
# The relay image is built separately from the nostream fork (see README.md)
# and referenced by tag: compose never pulls it.

services:
  nostream:
    image: ${NOSTREAM_IMAGE:-nostream-mesh:staging}
    # The image is built/loaded locally, not on a registry.
    pull_policy: never
    container_name: nso_nostream
    restart: unless-stopped
    environment:
      SECRET: ${SECRET:?SECRET is required}
      RELAY_PORT: "8008"
      NOSTR_CONFIG_DIR: /home/node/.nostr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # mesh-PG gateway. The listener is bound to docker0 (172.17.0.1), NOT
      # to this compose network's gateway (172.28.0.1), so use the docker0
      # address rather than extra_hosts/host-gateway.
      DB_HOST: ${DB_HOST:-172.17.0.1}
      DB_PORT: ${DB_PORT:-55432}
      DB_USER: ${DB_USER:-orchestrator}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-nostr_ts_relay}
      DB_MIN_POOL_SIZE: ${DB_MIN_POOL_SIZE:-0}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-8}
      # Same reasoning as the read pool: a publish must not hang for a
      # minute behind a busy worker.
      DB_ACQUIRE_CONNECTION_TIMEOUT: ${DB_ACQUIRE_CONNECTION_TIMEOUT:-3000}
      # Split reads and writes into separate pools.
      #
      # Writes still go through pg-gateway (DB_* above), which captures the
      # authoritative row into the orchestrator's central Postgres before
      # enqueueing it for the mesh. Reads deliberately do NOT go through the
      # gateway: every non-point REQ fans out over the mesh and holds a pooled
      # connection for the whole round trip (measured p99 ~3.7s). That is what
      # capped us at a handful of concurrent subscriptions per IP.
      #
      # RR0_* points at that same central Postgres instead. It is on the same
      # host, already contains every captured `events` row, and answers the
      # relay's indexed queries in ~1ms, so a connection is returned almost
      # immediately and the pool serves many more concurrent subscriptions.
      # This is a hot-read copy, not a new source of truth: mesh-PG providers
      # remain the distributed store.
      #
      # `event_tags` is derived. pg-gateway capture runs with
      # session_replication_role=replica, so the central copy needs the trigger
      # marked ALWAYS and a one-time rebuild:
      #   ./scripts/relay-central-read-index.sh
      # See docs/RELAY_READ_SCALING.md in the orchestrator repo.
      READ_REPLICA_ENABLED: "true"
      READ_REPLICAS: "1"
      RR0_DB_HOST: ${READ_DB_HOST:-postgres}
      RR0_DB_PORT: ${READ_DB_PORT:-5432}
      RR0_DB_USER: ${READ_DB_USER:-orchestrator}
      RR0_DB_PASSWORD: ${READ_DB_PASSWORD:?READ_DB_PASSWORD is required}
      RR0_DB_NAME: ${READ_DB_NAME:-orchestrator}
      RR0_DB_MIN_POOL_SIZE: ${RR0_DB_MIN_POOL_SIZE:-0}
      RR0_DB_MAX_POOL_SIZE: ${RR0_DB_MAX_POOL_SIZE:-40}
      # Local queries are ~1ms; 5s is already an order of magnitude above the
      # normal path and still refuses to join a runaway queue.
      RR0_DB_ACQUIRE_CONNECTION_TIMEOUT: ${RR0_DB_ACQUIRE_CONNECTION_TIMEOUT:-5000}
      REDIS_HOST: nostream-cache
      REDIS_PORT: "6379"
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    user: node:node
    volumes:
      # Settings overrides are source-controlled in this repo and mounted
      # read-only, so the running relay cannot drift from the committed file.
      # nostream deep-merges these over the image's default-settings.yaml.
      # The rest of NOSTR_CONFIG_DIR stays container-local and node-writable
      # (nostream writes settings backups + an audit log there).
      - ./settings.yaml:/home/node/.nostr/settings.yaml:ro
      # Landing page, also source-controlled and mounted read-only. The
      # deployed image predates the redesign (built 2026-09-07 14:00 UTC; the
      # redesign landed 16:28 UTC), so without this the relay serves the old
      # bootstrap page. Mounting the two files keeps the page in the repo and
      # survives container recreation — a previous `docker cp` into the
      # container's writable layer did not.
      - ./resources/index.html:/app/resources/index.html:ro
      # The css dir also carries the NIP-11 brand art (formstr-icon.png,
      # formstr-banner.png, formstr-wordmark.svg), served at /css/<name>.
      - ./resources/css:/app/resources/css:ro
    ports:
      # nginx (relay.stg.formstr.app) proxies to 127.0.0.1:8008, so keep the
      # listener on loopback and never expose the relay directly.
      - "127.0.0.1:8008:8008"
    depends_on:
      nostream-cache:
        condition: service_healthy
    healthcheck:
      # BusyBox wget (node:*-alpine) has no -H/--header support; a bare probe
      # that expects the NIP-11 document is enough.
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8008/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nostream-net
      - storage_default

  nostream-cache:
    image: redis:7.0.5-alpine3.16
    container_name: nso_nostream_cache
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - nostream_cache:/data
    command: sh -c 'redis-server --loglevel warning --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - nostream-net

  # Standalone moderation review UI (decoupled from the storage control plane).
  # Holds no keys; forwards the operator's NIP-98 header to the relay.
  moderation:
    build:
      context: ../..
      dockerfile: ./moderation/Dockerfile
    image: nso-moderation:staging
    pull_policy: never
    container_name: nso_moderation
    restart: unless-stopped
    environment:
      MODERATION_UI_PORT: ${MODERATION_UI_PORT:-3010}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-wss://relay.formstr.app}
      RELAY_MODERATION_BASE_URL: ${RELAY_MODERATION_BASE_URL:-https://relay.formstr.app}
      MODERATION_ORIGIN: ${MODERATION_ORIGIN:-https://relay.formstr.app}
    ports:
      - "127.0.0.1:${MODERATION_UI_PORT:-3010}:${MODERATION_UI_PORT:-3010}"
    networks:
      - nostream-net

networks:
  nostream-net:
    name: nostream-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # db-api lives here as `db`; the relay needs it for the moderation admin check.
  storage_default:
    external: true
    name: storage_default

volumes:
  nostream_cache:
